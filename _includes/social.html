<ul class="social-media-list">
  {%- if site.github_username -%}
  <li>
    <a href="https://github.com/{{ site.github_username | cgi_escape | escape }}" aria-label="GitHub profile of {{ site.github_username | escape }}">
      <i class="fab fa-github" aria-hidden="true"></i>
      <span class="username">{{ site.github_username | escape }}</span>
    </a>
  </li>
  {%- endif -%}

  {%- if site.email -%}
  <li>
    <a href="mailto:{{ site.email }}" aria-label="Email {{ site.email }}">
      <i class="fas fa-envelope" aria-hidden="true"></i>
      <span class="username">{{ site.email }}</span>
    </a>
  </li>
  {%- endif -%}

  {%- if site.linkedin_username -%}
  <li>
    <a href="https://www.linkedin.com/in/{{ site.linkedin_username | cgi_escape | escape }}" rel="noopener noreferrer" aria-label="LinkedIn profile of {{ site.author | default: site.title | escape }}">
      <i class="fab fa-linkedin" aria-hidden="true"></i>
      <span class="username">{{ site.linkedin_username | escape }}</span>
    </a>
  </li>
  {%- endif -%}
</ul>
