<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">

  <script>
    // Apply stored theme before first paint to avoid flashing the wrong mode
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    })();
  </script>

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}">

  <!-- Icons (svg + raster fallback for older user agents) -->
  <link rel="icon" href="{% link /assets/favicon.svg %}" type="image/svg+xml">
  <link rel="alternate icon" href="{% link /assets/favicon.ico %}">
  <link rel="apple-touch-icon" href="{% link /assets/apple-touch-icon.png %}">

  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- Font Awesome: preload then swap in non-blocking, with noscript fallback -->
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </noscript>

  <!-- Preconnect for third-party sources -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  {%- if page.content contains 'mermaid' -%}
  <!-- Mermaid.js is only downloaded on pages that actually embed diagrams -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

    function currentScheme() {
      const choice = document.documentElement.getAttribute('data-theme');
      if (choice === 'light' || choice === 'dark') return choice;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    async function renderMermaidDiagrams() {
      mermaid.initialize({
        startOnLoad: false,
        theme: currentScheme() === 'dark' ? 'dark' : 'default',
        securityLevel: 'strict'
      });

      document.querySelectorAll('code.language-mermaid').forEach((code) => {
        const container = code.closest('pre') ?? code.parentElement;
        const diagram = document.createElement('div');
        diagram.className = 'mermaid';
        diagram.dataset.source = code.textContent;
        diagram.textContent = code.textContent;
        container.replaceWith(diagram);
      });

      // Restore original source before re-rendering (svg would otherwise be parsed as a diagram)
      document.querySelectorAll('.mermaid[data-source]').forEach((d) => {
        d.textContent = d.dataset.source;
      });

      await mermaid.run();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMermaidDiagrams();
    });

    window.refreshMermaidDiagrams = renderMermaidDiagrams;
  </script>
  {%- endif -%}

  <!-- Site behaviors (deferred, cache-friendly) -->
  <script defer src="{{ "/assets/js/main.js" | relative_url }}"></script>
</head>
