<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <script>
    // Apply stored theme before paint to avoid flashing the wrong mode
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Mermaid.js for rendering diagrams -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

    function currentScheme() {
      const choice = document.documentElement.getAttribute('data-theme');
      if (choice === 'light' || choice === 'dark') return choice;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    async function renderMermaidDiagrams() {
      mermaid.initialize({
        startOnLoad: false,
        theme: currentScheme() === 'dark' ? 'dark' : 'default',
        securityLevel: 'loose'
      });

      document.querySelectorAll('code.language-mermaid').forEach((code) => {
        const container = code.closest('pre') ?? code.parentElement;
        const diagram = document.createElement('div');
        diagram.className = 'mermaid';
        diagram.dataset.source = code.textContent;
        diagram.textContent = code.textContent;
        container.replaceWith(diagram);
      });

      // Restore original source before re-rendering (svg would otherwise be parsed as a diagram)
      document.querySelectorAll('.mermaid[data-source]').forEach((d) => {
        d.textContent = d.dataset.source;
      });

      await mermaid.run();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMermaidDiagrams();
    });

    window.refreshMermaidDiagrams = renderMermaidDiagrams;
  </script>

  <script>
    // Theme toggle: persist choice, re-render diagrams with matching theme
    (function () {
      document.addEventListener('DOMContentLoaded', function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme');
          if (!current) {
            current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          if (typeof window.refreshMermaidDiagrams === 'function') {
            window.refreshMermaidDiagrams();
          }
        });
      });
    })();
  </script>

  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Dynamic UI: scroll progress bar, back-to-top button, reveal-on-scroll
    (function () {
      document.addEventListener('DOMContentLoaded', function () {
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Scroll progress bar
        var bar = document.createElement('div');
        bar.className = 'scroll-progress';
        document.body.appendChild(bar);
        var progress = function () {
          var doc = document.documentElement;
          var max = doc.scrollHeight - doc.clientHeight;
          bar.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';
        };
        window.addEventListener('scroll', progress, { passive: true });
        progress();

        // Back to top button
        var topBtn = document.createElement('button');
        topBtn.className = 'back-to-top';
        topBtn.setAttribute('aria-label', 'Back to top');
        topBtn.title = 'Back to top';
        topBtn.innerHTML = '<i class="fas fa-arrow-up" aria-hidden="true"></i>';
        topBtn.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
        });
        document.body.appendChild(topBtn);
        var toggleTop = function () {
          topBtn.classList.toggle('visible', window.scrollY > 400);
        };
        window.addEventListener('scroll', toggleTop, { passive: true });
        toggleTop();

        // Reveal sections on scroll
        var targets = document.querySelectorAll('.section-header, .about-section, .post-navigation');
        if (!reduceMotion && 'IntersectionObserver' in window && targets.length) {
          targets.forEach(function (el) { el.classList.add('reveal'); });
          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add('revealed');
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: 0.12 });
          targets.forEach(function (el) { observer.observe(el); });
        }
      });
    })();
  </script>
</head>
